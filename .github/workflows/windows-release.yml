name: Aden Windows sürümü

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: aden-windows-releases
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Windows kurulum ve güncelleme paketleri
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -creplace '^v', ''
          ./scripts/Pack-Aden.ps1 -Version $version -OutputDirectory ./Releases
      - name: GitHub Release yayımla
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $setup = @(Get-ChildItem ./Releases -File -Filter '*-Setup.exe')
          $full = @(Get-ChildItem ./Releases -File -Filter '*-full.nupkg')
          $feed = Get-Item ./Releases/releases.win-x64.json
          if ($setup.Count -ne 1 -or $full.Count -ne 1) { throw 'Release dosyaları eksik.' }
          $assets = @($setup[0].FullName, $full[0].FullName, $feed.FullName)
          gh release create $tag @assets --verify-tag --draft --generate-notes --title "Aden $tag"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release edit $tag --draft=false --latest
          exit $LASTEXITCODE

